<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>บันทึกรายจ่าย</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; } </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header & Summary -->
    <div class="bg-blue-600 text-white p-6 shadow-md rounded-b-3xl">
        <h1 class="text-xl font-semibold mb-2">💸 Expense Tracker</h1>
        <p class="text-blue-100 text-sm">ยอดใช้จ่ายวันนี้</p>
        <div class="text-4xl font-bold mt-1 tracking-tight">฿ <span id="todayTotal">---</span></div>
    </div>

    <!-- Form Section -->
    <div class="flex-1 px-6 py-8">
        <form id="expenseForm" class="space-y-5 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">รายการ</label>
                <input type="text" id="item" required placeholder="เช่น ค่าอาหาร, ค่าเน็ต" 
                       class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
            </div>

            <div class="flex gap-4">
                <div class="w-1/2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">จำนวนเงิน</label>
                    <input type="number" id="amount" required min="1" step="0.01" placeholder="0.00" 
                           class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none transition">
                </div>
                <div class="w-1/2">
                    <label class="block text-sm font-medium text-gray-700 mb-1">หมวดหมู่</label>
                    <select id="category" class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                        <option>อาหารและเครื่องดื่ม</option>
                        <option>การเดินทาง</option>
                        <option>ช้อปปิ้งและของใช้</option>
                        <option>สาธารณูปโภคและบิล</option>
                        <option>ความบันเทิง</option>
                        <option>อื่นๆ</option>
                    </select>
                </div>
            </div>

            <button type="submit" id="submitBtn" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 rounded-xl mt-4 shadow-lg shadow-blue-200 transition active:scale-95 flex justify-center items-center">
                <span>บันทึกรายการ</span>
            </button>
        </form>

        <!-- Status Message -->
        <div id="statusMsg" class="mt-4 text-center text-sm hidden font-medium"></div>
    </div>

    <script>
        // ⚠️ นำ URL จาก Google Apps Script (New Deployment) มาใส่ตรงนี้
        const GAS_WEB_APP_URL = 'ใส่_WEB_APP_URL_ที่นี่';

        // ดึงยอดรวมวันนี้ทันทีที่เปิดแอป
        async function fetchTodaySummary() {
            try {
                const response = await fetch(GAS_WEB_APP_URL + '?action=get_summary');
                const data = await response.json();
                document.getElementById('todayTotal').innerText = data.todayTotal.toLocaleString(undefined, {minimumFractionDigits: 2});
            } catch (error) {
                console.error('Error fetching summary', error);
            }
        }
        
        fetchTodaySummary();

        // จัดการเมื่อกดปุ่มบันทึก
        document.getElementById('expenseForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const statusMsg = document.getElementById('statusMsg');
            
            const payload = {
                action: 'add_expense',
                item: document.getElementById('item').value,
                amount: parseFloat(document.getElementById('amount').value),
                category: document.getElementById('category').value
            };

            // Loading state
            btn.innerHTML = '<svg class="animate-spin h-5 w-5 mr-2 text-white" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg> กำลังบันทึก...';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_WEB_APP_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await response.json();

                if(result.status === 'success') {
                    statusMsg.innerText = '✅ บันทึกข้อมูลสำเร็จ!';
                    statusMsg.className = 'mt-4 text-center text-sm text-green-600 font-medium block';
                    document.getElementById('expenseForm').reset();
                    fetchTodaySummary(); // อัปเดตยอดรวมใหม่
                }
            } catch (error) {
                statusMsg.innerText = '❌ เกิดข้อผิดพลาด กรุณาลองใหม่';
                statusMsg.className = 'mt-4 text-center text-sm text-red-600 font-medium block';
            }

            // Reset button
            setTimeout(() => {
                btn.innerHTML = '<span>บันทึกรายการ</span>';
                btn.disabled = false;
                statusMsg.classList.add('hidden');
            }, 3000);
        });
    </script>
</body>
</html>
