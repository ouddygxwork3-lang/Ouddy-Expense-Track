<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Expense Bot Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Kanit', sans-serif; background-color: #8bbadd; } /* สีพื้นหลังแชท LINE */
        .bubble-user { background-color: #85e04e; border-radius: 18px 18px 4px 18px; color: #111; } /* สีบับเบิลผู้ใช้ */
        .bubble-bot { background-color: #ffffff; border-radius: 18px 18px 18px 4px; color: #111; } /* สีบับเบิลบอท */
        .time-text { font-size: 0.65rem; color: #666; margin-top: auto; padding-bottom: 2px; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.2); border-radius: 10px; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <!-- Header (LINE Style) -->
    <div class="bg-[#273246] text-white flex items-center px-4 py-3 shadow-md z-10">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-xl overflow-hidden mr-3">
            💸
        </div>
        <div>
            <h1 class="font-medium text-lg leading-tight">Expense Bot</h1>
            <p class="text-xs text-gray-300">Web Interface</p>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chatArea" class="flex-1 overflow-y-auto p-4 flex flex-col space-y-4 pb-24">
        <!-- Initial Loading Message -->
        <div class="flex justify-start">
            <div class="bubble-bot px-4 py-2 max-w-[80%] shadow-sm text-sm">
                กำลังดึงยอดใช้จ่ายของวันนี้... ⏳
            </div>
        </div>
    </div>

    <!-- Input Bar -->
    <div class="bg-white p-3 flex items-center border-t border-gray-200 fixed bottom-0 w-full shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
        <form id="chatForm" class="flex w-full gap-2 items-center">
            <input type="text" id="messageInput" autocomplete="off" placeholder="เช่น: ค่าข้าว 50 หรือ /วันนี้" 
                   class="flex-1 bg-gray-100 rounded-full px-4 py-2.5 outline-none focus:ring-2 focus:ring-[#85e04e] text-sm transition">
            <button type="submit" id="sendBtn" class="bg-blue-600 hover:bg-blue-700 text-white rounded-full w-10 h-10 flex justify-center items-center shrink-0 transition active:scale-90">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 ml-1" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
                </svg>
            </button>
        </form>
    </div>

    <script>
        // ⚠️ นำ Web App URL ของ Apps Script มาใส่ตรงนี้
        const GAS_WEB_APP_URL = 'ใส่_WEB_APP_URL_ที่นี่';
        
        const chatArea = document.getElementById('chatArea');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');

        // ฟังก์ชันเลื่อนหน้าจอลงล่างสุด
        function scrollToBottom() {
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // ฟังก์ชันสร้างบับเบิลข้อความ
        function addMessage(text, isUser = false) {
            const time = new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
            const alignClass = isUser ? "justify-end" : "justify-start";
            const bubbleClass = isUser ? "bubble-user" : "bubble-bot";
            const timeHTML = isUser ? `<div class="time-text mr-2">${time}</div>` : "";
            const timeHTMLBot = !isUser ? `<div class="time-text ml-2">${time}</div>` : "";
            
            // แปลง \n เป็น <br> ให้ขึ้นบรรทัดใหม่ได้
            const formattedText = text.replace(/\n/g, '<br>');

            const msgDiv = document.createElement('div');
            msgDiv.className = `flex ${alignClass} mb-4`;
            msgDiv.innerHTML = `
                ${timeHTML}
                <div class="${bubbleClass} px-4 py-2.5 max-w-[75%] shadow-sm text-sm">
                    ${formattedText}
                </div>
                ${timeHTMLBot}
            `;
            chatArea.appendChild(msgDiv);
            scrollToBottom();
        }

        // โหลดข้อมูลยอดสรุปวันนี้ตอนเปิดหน้าเว็บ
        async function fetchInitialSummary() {
            try {
                const response = await fetch(GAS_WEB_APP_URL + '?action=get_summary');
                const data = await response.json();
                
                // ลบข้อความกำลังโหลด
                chatArea.innerHTML = '';
                
                addMessage(`👋 ยินดีต้อนรับ!\nยอดใช้จ่ายวันนี้รวม: ฿${data.todayTotal.toLocaleString(undefined, {minimumFractionDigits: 2})}\n\nพิมพ์รายการ (เช่น "ค่ารถ 100") เพื่อบันทึก หรือพิมพ์ "/วิธีใช้" ได้เลยครับ`);
            } catch (error) {
                chatArea.innerHTML = '';
                addMessage('⚠️ ไม่สามารถเชื่อมต่อฐานข้อมูลได้ กรุณารีเฟรชหน้าเว็บครับ');
            }
        }
        
        // ดึงข้อมูลเมื่อโหลดเว็บเสร็จ
        fetchInitialSummary();

        // จัดการเมื่อพิมพ์แชทและกดส่ง
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            // แสดงบับเบิลฝั่งผู้ใช้
            addMessage(text, true);
            messageInput.value = '';
            
            // แสดงสถานะกำลังพิมพ์ (ฝั่งบอท)
            const typingDiv = document.createElement('div');
            typingDiv.id = "typingIndicator";
            typingDiv.className = "flex justify-start mb-4";
            typingDiv.innerHTML = `<div class="bubble-bot px-4 py-2 shadow-sm text-sm text-gray-500">กำลังประมวลผล...</div>`;
            chatArea.appendChild(typingDiv);
            scrollToBottom();

            // ส่งข้อมูลไปที่ Apps Script Backend
            try {
                const response = await fetch(https://script.google.com/macros/s/AKfycbzvfbHgbJf3GZL1Zvd1XWXjn0MexShesxsbry8QsOK2qn6cO8C-34E9XQipCS_kra1jQw/exec, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'web_chat', text: text })
                });
                const result = await response.json();

                // ลบข้อความ "กำลังประมวลผล..."
                document.getElementById('typingIndicator').remove();
                
                // แสดงบับเบิลตอบกลับจากบอท
                addMessage(result.reply);

            } catch (error) {
                document.getElementById('typingIndicator').remove();
                addMessage('❌ ขออภัย เกิดข้อผิดพลาดในการเชื่อมต่อระบบครับ');
            }
        });
    </script>
</body>
</html>
